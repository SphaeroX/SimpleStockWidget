name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Format prüfen
        run: dart format --output=none --set-exit-if-changed lib tests

      - name: Analyse
        run: flutter analyze

      - name: Dart-Tests
        run: flutter test tests/

      - name: Kotlin-Tests (Widget-Logik)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Release-Schlüssel einrichten (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SSW_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SSW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APKs bauen
        env:
          SSW_KEYSTORE_PASSWORD: ${{ secrets.SSW_KEYSTORE_PASSWORD }}
          SSW_KEY_ALIAS: ${{ secrets.SSW_KEY_ALIAS }}
          SSW_KEY_PASSWORD: ${{ secrets.SSW_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/SimpleStock-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/SimpleStock-armv7.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/SimpleStock-universal.apk
          if [ -z "${SSW_KEYSTORE_PATH:-}" ]; then echo "::warning::Ohne Release-Schlüssel signiert (Debug). Updates über ältere Versionen schlagen dann fehl."; fi

      - name: Release nötig?
        id: release
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "create=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      # Release bei Tag v* oder bei Push auf main, wenn es für die Version in pubspec.yaml noch keinen Tag gibt.
      - name: GitHub-Release
        if: steps.release.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SimpleStockWidget ${{ steps.release.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
